<title id="title">Charan Neelam | AI engineering</title>
<desc id="desc">Llama 3.2 citation experiment. Out of 40 synthetic cases per prompt, both prompts answered 35 correctly. The baseline passed both checks on 17 cases and the longer prompt on 10.</desc>
