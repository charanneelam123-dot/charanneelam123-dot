<text x="40" y="211" fill="#cadaD6" font-size="18">Llama 3.2  /  40 synthetic cases per prompt</text>
<text x="40" y="260" fill="#fff9eb" font-size="20">Baseline</text>
<text x="40" y="304" fill="#fff9eb" font-size="20">Longer prompt</text>
